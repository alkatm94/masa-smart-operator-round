<!doctype html><html><head><meta charset="utf-8"><title>MASA MediaPipe smoke test</title></head><body><h1>Loading AI...</h1><img id="sample" src="/test-vision/general-objects.jpg" width="640"><pre id="result">Waiting for local model</pre><script type="module">
import {FilesetResolver,ObjectDetector} from "/models/mediapipe/vision_bundle.js";
const output=document.querySelector("#result"),image=document.querySelector("#sample"),heading=document.querySelector("h1");
try{await image.decode();const vision=await FilesetResolver.forVisionTasks("/models/mediapipe");const detector=await ObjectDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:"/models/general-object/efficientdet_lite0.tflite"},runningMode:"IMAGE",scoreThreshold:.35,maxResults:12});const started=performance.now();const detections=detector.detect(image).detections.map(d=>({class:d.categories[0]?.categoryName,confidence:d.categories[0]?.score,bbox:d.boundingBox}));heading.textContent="AI Ready";output.textContent=JSON.stringify({model:"EfficientDet-Lite0",inferenceMs:performance.now()-started,detections},null,2);}catch(error){heading.textContent="AI failed";output.textContent=String(error?.stack||error);}
</script></body></html>
